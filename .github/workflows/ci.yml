name: player-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality-and-native-build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: cloudgta-player
    env:
      CLOUDGTA_PLATFORM_REVISION: 1ae084d6fe3c9e904b9128965ba645fa96d5565c
    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudgta-player
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cloudgta-docs
          ref: d6947364ebb7f6d150c4f70c88486949e96f51fb
          path: docs
      - shell: pwsh
        run: ./scripts/bootstrap.ps1
